# @package _global_

defaults:
  - /experiment/dplm2: dprm_dplm_650m
  - _self_

name: "dprm_joint_tcheby_dplm_650m"

trainer:
  max_steps: 5000
  val_check_interval: 5000

model:
  order:
    reward: aar_structure_tchebycheff
    reward_aa_weight: 0.5
